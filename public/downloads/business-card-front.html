<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Golden Tide — Business Card Front</title>
  <style>
    @page { size: 90mm 50mm; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 90mm;
      height: 50mm;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      background: #fff;
    }
    .card {
      width: 90mm;
      height: 50mm;
      padding: 5mm 5.5mm;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(60mm 40mm at 100% 0%, rgba(184, 134, 11, 0.18), transparent 60%),
        linear-gradient(135deg, #f7fafb 0%, #e8f1f4 100%);
      border: 0.4mm solid #d5dee3;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 1.6mm;
      background: #1a6b7a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 2.5mm;
    }
    .brand-logo {
      width: 8mm;
      height: 8mm;
      border-radius: 1.4mm;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 0 0.3mm rgba(184, 134, 11, 0.4);
    }
    .brand h1 {
      font-size: 11pt;
      line-height: 1;
      color: #142028;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 5.5pt;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b8860b;
      font-weight: 700;
      margin-top: 0.8mm;
    }
    .person {
      align-self: center;
    }
    .person h2 {
      font-size: 12pt;
      color: #142028;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .person .role {
      margin-top: 1mm;
      font-size: 8pt;
      color: #1a6b7a;
      font-weight: 600;
    }
    .person .smb {
      margin-top: 1.5mm;
      font-size: 6.5pt;
      color: #4a5d68;
      letter-spacing: 0.02em;
    }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: end;
      font-size: 6.8pt;
      color: #4a5d68;
      line-height: 1.35;
      border-top: 0.4mm solid #d5dee3;
      padding-top: 2mm;
    }
    .foot strong { color: #142028; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img class="brand-logo" src="Golden-Tide-Logo-Official.png" width="64" height="64" alt="Golden Tide" />
      <div>
        <h1>Golden Tide</h1>
        <p>IT Professional Services</p>
      </div>
    </div>
    <div class="person">
      <h2>Justin Van Staden</h2>
      <div class="role">IT Director · Founder</div>
      <div class="smb">Small &amp; medium businesses welcome</div>
    </div>
    <div class="foot">
      <div>
        <strong>+685 770 3733</strong><br />
        justin@goldentide.cloud
      </div>
      <div style="text-align:right;">
        itsamoa.goldentide.cloud<br />
        Faleasiu, Samoa
      </div>
    </div>
  </div>
</body>
</html>
