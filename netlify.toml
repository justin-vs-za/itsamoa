[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE44_APP_ID = "6aa613ccd990b946b850fb36"
  VITE_BASE44_APP_BASE_URL = "https://itsamoa.base44.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Proxy Base44 backend so Lead.create / auth work when hosted on Netlify
[[redirects]]
  from = "/api/*"
  to = "https://itsamoa.base44.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
